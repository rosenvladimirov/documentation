name: Build & deploy Odoo 19 docs to Pages

on:
  push:
    branches: ["19.0"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential
          python -m pip install --upgrade pip wheel
          # Sphinx 4.3.2 ползва pkg_resources (махнат в setuptools>=81) и
          # чупи на Jinja2>=3.1 / MarkupSafe>=2.1 — пинваме съвместими
          python -m pip install "setuptools<81"
          pip install -r requirements.txt "Jinja2==3.0.3" "MarkupSafe==2.0.1"

      - name: Build HTML (без odoo core → само user docs; ORM autodoc се прескача)
        run: |
          make html
          make static
          # custom домейн + изключваме Jekyll (Sphinx ползва _static/_sources с _)
          echo "docs.odoo-shell.dev" > _build/html/CNAME
          touch _build/html/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
